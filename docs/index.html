<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shinlinst Studio</title>
    <style>
    body {
        background-color: #000000;
        color: purple;
        font-family: "Comic Sans MS", "Comic Sans", cursive;
        padding: 2rem;
    }

    table {
        width: 100%;
        table-layout: fixed; /* Forces columns to strictly follow assigned width percentages */
        border-collapse: collapse; /* Combines double borders into a single clean line */
        margin-top: 1rem;
    }

    th, td {
        width: 50%; /* Each cell takes exactly half of the table width */
        border: 2px solid purple; /* Purple lines for borders */
        padding: 10px;
        text-align: left;
        word-wrap: break-word; /* Prevents long text like IDs from breaking the 50% width limit */
    }

    th {
        background-color: #1a001a; /* Slightly lighter dark purple for headers */
    }
    </style>
</head>
<body>
    
</body>
</html>
